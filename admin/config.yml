backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "settings"
    label: "Site Text"
    files:
      - name: "settings"
        label: "Homepage Text"
        file: "content/settings.json"
        fields:
          - { label: "Eyebrow tag (small text above headline)", name: "heroEyebrow", widget: "string" }
          - { label: "Main headline", name: "heroHeadline", widget: "string" }
          - { label: "Intro paragraph", name: "heroIntro", widget: "text" }
          - { label: "\"How it works\" title", name: "howItWorksTitle", widget: "string" }
          - { label: "\"How it works\" subtitle", name: "howItWorksSubtitle", widget: "string" }
          - { label: "Step 1 title", name: "step1Title", widget: "string" }
          - { label: "Step 1 text", name: "step1Text", widget: "string" }
          - { label: "Step 2 title", name: "step2Title", widget: "string" }
          - { label: "Step 2 text", name: "step2Text", widget: "string" }
          - { label: "Step 3 title", name: "step3Title", widget: "string" }
          - { label: "Step 3 text", name: "step3Text", widget: "string" }
          - { label: "Contact section headline", name: "contactHeadline", widget: "string" }
          - { label: "Contact section text", name: "contactText", widget: "string" }
          - { label: "Footer notice", name: "footerNotice", widget: "string" }

  - name: "properties"
    label: "Properties"
    label_singular: "Property"
    files:
      - name: "properties"
        label: "Property Listings"
        file: "content/properties.json"
        fields:
          - label: "Listings"
            name: "properties"
            widget: "list"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Photo", name: "image", widget: "image", required: false, hint: "Upload a property photo" }
              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - "Apartment"
                  - "2 Bedroom Flat"
                  - "House"
                  - "Room & Parlour Selfcon"
                  - "A Room Selfcon"
                  - "Single Room Selfcon"
              - { label: "Location", name: "location", widget: "string" }
              - { label: "Price", name: "price", widget: "string", hint: "e.g. ₦350,000 / year" }
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["Available", "Unavailable"]
                default: "Available"
              - { label: "Featured", name: "featured", widget: "boolean", default: false }
              - { label: "Notes", name: "notes", widget: "string", required: false }
